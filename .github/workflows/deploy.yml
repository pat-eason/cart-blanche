name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys at once, and never cancel one midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: API vet & build
        working-directory: apps/api
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
          go vet ./...
          go build ./...

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Web typecheck & build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @cart-blanche/web build

  images:
    name: Build & push images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.names.outputs.api }}
      web: ${{ steps.names.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${repo}-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repo}-web:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.names.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # The app is served at https://apps.pateason.dev/cart-blanche/, so assets/links/API calls
          # must carry that prefix; it's baked in at build time.
          build-args: BASE_PATH=/cart-blanche/
          tags: ${{ steps.names.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to droplet
    needs: images
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment in GitHub if you want a manual gate.
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_DIR: /opt/cart-blanche
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host droplet
            HostName ${{ secrets.DROPLET_HOST }}
            User ${{ secrets.DROPLET_USER }}
            Port ${{ secrets.DROPLET_SSH_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONF

      - name: Sync compose files
        run: scp docker-compose.yml docker-compose.prod.yml "droplet:${DEPLOY_DIR}/"

      - name: Log the droplet in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh droplet "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull images and restart
        env:
          # open | invite | closed (defaults to closed if the secret is unset).
          REGISTRATION_MODE: ${{ secrets.REGISTRATION_MODE }}
          REGISTRATION_INVITE_CODE: ${{ secrets.REGISTRATION_INVITE_CODE }}
        run: |
          ssh droplet "REGISTRATION_MODE='${REGISTRATION_MODE:-closed}' REGISTRATION_INVITE_CODE='${REGISTRATION_INVITE_CODE}' API_IMAGE='${{ needs.images.outputs.api }}' WEB_IMAGE='${{ needs.images.outputs.web }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/cart-blanche
          # First deploy only: create .env with a random database password. Never overwritten afterwards,
          # because Postgres reads its password when the volume is first created.
          if [ ! -f .env ]; then
            printf 'POSTGRES_PASSWORD=%s\n' "$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)" > .env
            chmod 600 .env
          fi
          export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
          export REGISTRATION_MODE REGISTRATION_INVITE_CODE
          docker compose pull api web
          docker compose up -d --no-build --remove-orphans
          echo "waiting for the API to report healthy..."
          for i in $(seq 1 30); do
            if docker compose exec -T api wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "healthy"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose ps
          docker compose logs --tail 50 api
          exit 1
          REMOTE

      # The proxy owns the hostname/certificate; this app only publishes its route under /cart-blanche/.
      # proxy-site validates the whole Caddy config and rolls back if the snippet is invalid.
      - name: Publish route to the proxy
        run: ssh droplet "proxy-site install cart-blanche" < deploy/cart-blanche.caddy

      - name: Remove stored registry credentials
        if: always()
        run: ssh droplet "docker logout ghcr.io" || true
